# ---------------------------------------------------------------------------
# hpr-sim example: TESLA 1.3 GHz 9-cell cavity
#
# The inner wall is a parametric model built from the published TESLA shape
# (B. Aune et al., PRST-AB 3, 092001): 7 mid cells + 2 end cells, beam tubes,
# water-tight. Generate it with:
#
#     python tools/make_tesla_cavity.py
#
# Scan region and ray length are set to "auto" so they are derived from the
# mesh (multi-cell chain detection).
# ---------------------------------------------------------------------------
cavity: tesla_9cell
mesh:
  stl: ../data/tesla_9cell_inner.stl
  # step: ../path/to/STEP   # (auto-converted to STL if a CAD file is given)

water:
  rho: 1000.0
  surface_tension: 0.073
  rho_air: 1.2
  mu_air: 1.81e-5

jet:
  pressure_bar: 100
  nozzle_diameter_mm: 0.5
  cd: 0.7
  velocity_model: droplet          # droplet (default) or linear
  drop_cd_mode: schiller-naumann   # schiller-naumann | morsi-alexander | putnam | constant

nozzle:
  n_holes: 6
  tilt_fwd_deg: 25
  tilt_bwd_deg: -25
  n_spray: 11
  jet_angle_deg: 5
  head_diameter_mm: 25

motion:
  x_start_mm: auto                 # auto = detect cell chain from the mesh
  x_end_mm: auto
  trans_speed_mm_s: 10
  rot_speed_rpm: 24
  n_recip: 2

sim:
  step_trans_mm: 5.0
  step_rot_deg: 15.0
  dt_s: 0.5
  clean_cos_thresh: 0.5
  d_min_mm: 5
  d_max_mm: 160
  dmax_kd: 0
  min_impact_bar: 0
  ray_len_max_mm: auto

output:
  dir: ../data/outputs
  vtk: true
  plots: true
  json: true
